# Tiny Tapeout project information
project:
  title:        "Reloj Digital (RTC) y Calendario"      # Project title
  author:       "Iván Najera, David Ricardez, Ashlie Henriquez, Antonio Rodríguez, Javier Chango"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Reloj en tiempo real con calendario de día/mes, alarma programable y salida multiplexada directa para controlar un display de 7 segmentos de 4 dígitos."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_clock_calendar"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "view_mode[0] (00: Hora, 01: Fecha, 10: Alarma)"
  ui[1]: "view_mode[1] (Selector de vista)"
  ui[2]: "edit_en (0: Normal, 1: Modo ajuste manual)"
  ui[3]: "field_sel[0] (00: Hora/Día, 01: Min/Mes, 10: Seg/Año)"
  ui[4]: "field_sel[1] (Selector de campo a editar)"
  ui[5]: "inc_btn (Pulso +1 al campo seleccionado)"
  ui[6]: "alarm_en (1: Alarma activa, 0: Apagada/Silenciar)"
  ui[7]: "fast_sim (1: Modo simulación rápida 16x)"

  # Outputs
  uo[0]: "seg_a (Display 7 segmentos - Segmento A)"
  uo[1]: "seg_b (Display 7 segmentos - Segmento B)"
  uo[2]: "seg_c (Display 7 segmentos - Segmento C)"
  uo[3]: "seg_d (Display 7 segmentos - Segmento D)"
  uo[4]: "seg_e (Display 7 segmentos - Segmento E)"
  uo[5]: "seg_f (Display 7 segmentos - Segmento F)"
  uo[6]: "seg_g (Display 7 segmentos - Segmento G)"
  uo[7]: "seg_dp (Punto decimal separador de pares)"

  # Bidirectional pins
  uio[0]: "digit_sel[0] (Habilitación Dígito 0 - Derecha)"
  uio[1]: "digit_sel[1] (Habilitación Dígito 1)"
  uio[2]: "digit_sel[2] (Habilitación Dígito 2)"
  uio[3]: "digit_sel[3] (Habilitación Dígito 3)"
  uio[4]: "digit_sel[4] (Habilitación Dígito 4)"
  uio[5]: "digit_sel[5] (Habilitación Dígito 5 - Izquierda)"
  uio[6]: "alarm_ring (Salida alarma sonando)"
  uio[7]: "is_leap (Indicador LED de año bisiesto)"

# Do not change!
yaml_version: 6
