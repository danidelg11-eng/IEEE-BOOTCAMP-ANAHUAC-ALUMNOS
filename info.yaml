# Tiny Tapeout project information
project:
  title:        "4-bit Array Multiplier"      # Project title
  author:       "Daniel Delgado Gutiérrez, David Suárez Pérez, Emiliano Almanza Repetto, Inés Tejada Madrazo, María Pía Pacheco Rodríguez"
  discord:      ""
  description:  "Gate-level 4x4 array multiplier (16 AND + 12 full adders) with D flip-flop input/output registers"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000  # Clock frequency in Hz (matches CLOCK_PERIOD = 20 ns in src/config.json)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_danidelg11_eng_multiplier_4bit"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "register_8.v"
    - "d_ff.v"
    - "ripple_carry_4.v"
    - "full_adder.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs 
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  # Outputs
  uo[0]: "P0"
  uo[1]: "P1"
  uo[2]: "P2"
  uo[3]: "P3"
  uo[4]: "P4"
  uo[5]: "P5"
  uo[6]: "P6"
  uo[7]: "P7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6

